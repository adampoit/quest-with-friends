name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  create:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Immutable source commit to test
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  unit:
    if: github.event_name != 'create' || (github.event.ref_type == 'branch' && startsWith(github.event.ref, 'compatibility/'))
    runs-on: ubuntu-latest
    container: python:${{ matrix.python }}-bookworm
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Install Lua test dependencies
        run: |
          apt-get update
          apt-cache show lua5.1 lua-busted
          apt-get install -y --no-install-recommends lua5.1 lua-busted
          ln -s /usr/bin/lua5.1 /usr/local/bin/lua
      - name: Run Lua unit tests
        run: busted --lua=lua5.1 tests -v
      - name: Run Python tooling tests
        run: python3 -m unittest discover -s tools/tests -v
      - name: Check release packaging
        run: |
          python3 tools/bundle_addon.py
          python3 -m zipfile -t dist/QuestWithFriends-*.zip
          python3 tools/bundle_addon.py --dev
          python3 -m zipfile -t dist/QuestWithFriendsDev-*.zip

  simulator:
    if: github.event_name != 'create' || (github.event.ref_type == 'branch' && startsWith(github.event.ref, 'compatibility/'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - name: Build portable wow-ui-sim image
        uses: docker/build-push-action@v6
        with:
          context: ./tools/simulator
          platforms: linux/amd64
          target: test
          tags: wow-ui-sim:0.1.32-portable
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run wow-ui-sim integration tests
        run: |
          docker run --rm \
            -e WOW_SIM_LOAD_OUT_OF_DATE_ADDONS=1 \
            -v "$GITHUB_WORKSPACE:/app/Interface/AddOns/QuestWithFriends:ro" \
            wow-ui-sim:0.1.32-portable run-tests QuestWithFriends
          python3 tools/bundle_addon.py --dev-toc
          docker run --rm \
            -e WOW_SIM_LOAD_OUT_OF_DATE_ADDONS=1 \
            -v "$GITHUB_WORKSPACE:/app/Interface/AddOns/QuestWithFriendsDev:ro" \
            wow-ui-sim:0.1.32-portable run-tests QuestWithFriendsDev
