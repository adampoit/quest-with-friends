name: Check client compatibility candidates

on:
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-version-check
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Authenticate as not-adam
        id: not-adam
        uses: adampoit/not-adam@v1
        with:
          private-key: ${{ secrets.NOT_ADAM_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ steps.not-adam.outputs.token }}

      - name: Fetch CurseForge game versions
        env:
          CF_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
        run: |
          test -n "$CF_TOKEN"
          curl --fail-with-body --silent --show-error \
            --retry 3 --connect-timeout 15 --max-time 120 \
            --header "X-Api-Token: $CF_TOKEN" \
            https://wow.curseforge.com/api/game/versions \
            > "$RUNNER_TEMP/curseforge-versions.json"

      - name: Open compatibility review PRs
        env:
          GH_TOKEN: ${{ steps.not-adam.outputs.token }}
          GH_REPO: ${{ github.repository }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          REVIEWER: ${{ vars.COMPATIBILITY_REVIEWER || github.repository_owner }}
        run: |
          python3 tools/check_game_versions.py "$RUNNER_TEMP/curseforge-versions.json" \
            --create-prs --base "$BASE_BRANCH" --reviewer "$REVIEWER"
