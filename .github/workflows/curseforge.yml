name: Publish to CurseForge

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: curseforge-${{ github.event.release.id }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/published-package.yml

  upload:
    needs: verify
    if: needs.verify.outputs.curseforge == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      CF_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
      RELEASE_CHANNEL: ${{ needs.verify.outputs.channel }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: published-package
      - name: Validate configuration
        run: test -n "$CF_PROJECT_ID" && [[ "$CF_PROJECT_ID" =~ ^[0-9]+$ ]]

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          path: source

      - name: Resolve CurseForge game versions from release ZIP
        env:
          CF_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
        run: |
          test -n "$CF_TOKEN"
          curl --fail-with-body --silent --show-error \
            --header "X-Api-Token: $CF_TOKEN" \
            https://wow.curseforge.com/api/game/versions \
            > curseforge-versions.json
          python3 source/tools/curseforge_game_versions.py \
            "dist/QuestWithFriends-${RELEASE_TAG#v}.zip" \
            curseforge-versions.json > game-versions.json

      - name: Prepare CurseForge metadata
        run: |
          jq --arg channel "$RELEASE_CHANNEL" --slurpfile versions game-versions.json '
            {
              changelog: (.body // ""),
              changelogType: "markdown",
              displayName: (.name // .tag_name),
              gameVersions: $versions[0],
              releaseType: (if $channel == "stable" then "release" else $channel end)
            }
          ' release.json > metadata.json

      - name: Upload to CurseForge
        env:
          CF_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
        run: |
          test -n "$CF_TOKEN"
          curl --fail-with-body --silent --show-error \
            --header "X-Api-Token: $CF_TOKEN" \
            --form "metadata=<metadata.json" \
            --form "file=@dist/QuestWithFriends-${RELEASE_TAG#v}.zip" \
            "https://wow.curseforge.com/api/projects/$CF_PROJECT_ID/upload-file" \
            > upload-result.json
          file_id="$(jq -er '.id | select(type == "number" and . > 0)' upload-result.json)"
          printf 'Uploaded %s to CurseForge (file ID: %s).\n' \
            "$RELEASE_TAG" "$file_id" >> "$GITHUB_STEP_SUMMARY"
