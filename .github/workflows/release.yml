name: Prepare release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve release tag and validate package
        id: release
        run: |
          version="$(python3 -c 'import pathlib, re; print(re.search(r"^##\s*Version:\s*(\S+)\s*$", pathlib.Path("QuestWithFriends.toc").read_text(), re.MULTILINE)[1])')"
          tag="v$version"
          python3 tools/bundle_addon.py --tag "$tag"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

  tests:
    needs: validate
    uses: ./.github/workflows/test.yml

  release:
    needs: [validate, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      TARGET_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build addon ZIP
        run: python3 tools/bundle_addon.py --tag "$RELEASE_TAG"
      - name: Create release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$RELEASE_TAG" \
            -f "sha=$TARGET_SHA"
      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            "dist/QuestWithFriends-${RELEASE_TAG#v}.zip" \
            --verify-tag --draft --generate-notes \
            --title "$RELEASE_TAG" \
            "${flags[@]}"
